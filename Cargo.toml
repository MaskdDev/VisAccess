[package]
name = "vis_access"
version = "0.1.0"
edition = "2021"

[dependencies]
poise = "0.6.1"
serenity = "0.12.2"
tokio = { version = "1.40.0", features = ["rt-multi-thread"] }
serde = { version = "1.0.210", features = ["derive"] }
redis = { version = "0.27.6", features = ["tokio-comp"] }
redis-macros = "0.4.2"
serde_json = "1.0.133"
